services:
  _defaults:
    autowire: true
    autoconfigure: true
    public: false

  _instanceof:
    In2code\In2mcp\Domain\Mcp\Tool\ToolInterface:
      tags: ['in2mcp.tool']

  In2code\In2mcp\:
    resource: '../Classes/*'
    exclude: '../Classes/Domain/Model/*'

  In2code\In2mcp\Domain\Mcp\Tool\ToolRegistry:
    arguments:
      $tools: !tagged_iterator in2mcp.tool

  In2code\In2mcp\Domain\Repository\BackendUserRepository:
    arguments:
      $hashCache: '@cache.hash'

  cache.in2mcp_upload:
    class: TYPO3\CMS\Core\Cache\Frontend\FrontendInterface
    factory: ['@TYPO3\CMS\Core\Cache\CacheManager', 'getCache']
    arguments: ['in2mcp_upload']

  In2code\In2mcp\Domain\Service\UploadTokenService:
    arguments:
      $uploadTokenCache: '@cache.in2mcp_upload'

  cache.in2mcp_oauth:
    class: TYPO3\CMS\Core\Cache\Frontend\FrontendInterface
    factory: ['@TYPO3\CMS\Core\Cache\CacheManager', 'getCache']
    arguments: ['in2mcp_oauth']

  In2code\In2mcp\Domain\Service\AuthorizationService:
    arguments:
      $oAuthCache: '@cache.in2mcp_oauth'
